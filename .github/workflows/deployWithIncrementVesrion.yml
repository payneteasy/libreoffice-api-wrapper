name: Build and test

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:

    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
    - uses: actions/checkout@v4

    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: temurin
        cache: maven

    - name: Build without test
      run: mvn -B --no-transfer-progress -Dmaven.test.skip=true clean package

    - name: Start docker (libreoffice)
      run: |
        docker run -d --name libreoffice -p 8100:8100 hdejager/libreoffice-api
        docker inspect -f 'container status: {{.State.Status}}' libreoffice

    - name: Start proxy service (libreoffice-api-wrapper)
      run: |
        jar=$(ls libreoffice-api-wrapper-server/target/*-jar-with-dependencies.jar)
        echo "starting $jar"
        nohup java -jar "$jar" > wrapper.log 2>&1 &
        for _ in $(seq 1 30); do
          if curl -sf http://localhost:8080/converter/management/version.txt; then
            echo "wrapper is up"
            exit 0
          fi
          sleep 2
        done
        echo "wrapper did not answer on port 8080 within 60s"
        cat wrapper.log
        exit 1

    - name: Wait for libreoffice to convert
      run: |
        docx=libreoffice-api-wrapper-server/src/test/resources/example.docx
        for _ in $(seq 1 30); do
          code=$(curl -s --max-time 60 -o smoke.pdf -w '%{http_code}' \
            -H 'Content-Type: application/vnd.openxmlformats-officedocument.wordprocessingml.document' \
            --data-binary "@$docx" \
            'http://localhost:8080/converter/convert?inputFormat=docx&outputFormat=pdf')
          if [ "$code" = "200" ] && [ "$(head -c 4 smoke.pdf)" = "%PDF" ]; then
            echo "conversion works, got $(wc -c < smoke.pdf) bytes of pdf"
            exit 0
          fi
          echo "backend not ready yet (http $code)"
          sleep 4
        done
        echo "libreoffice did not convert anything within 120s"
        exit 1

    - name: Run tests
      run: mvn -B --no-transfer-progress test

    - name: Dump logs
      if: failure()
      run: |
        echo "===== wrapper.log ====="
        cat wrapper.log || true
        echo "===== docker logs libreoffice ====="
        docker logs libreoffice || true

    - name: Upload surefire reports
      if: failure()
      uses: actions/upload-artifact@v4
      with:
        name: surefire-reports
        path: libreoffice-api-wrapper-server/target/surefire-reports/
        if-no-files-found: ignore